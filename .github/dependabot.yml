version: 2
# No `pip` entry on purpose: requirements/serve-*.txt are uv lock files, and Dependabot bumps their pins one at a
# time, which breaks exact pairs such as pydantic/pydantic-core. Upgrade Python dependencies with `make upgrade`.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/docker"]
    schedule:
      interval: weekly
